# Запуск: docker compose up -d   →   игра на http://<адрес-сервера>:3000
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: puk
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pukoplot}
      POSTGRES_DB: pukoplot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U puk -d pukoplot"]
      interval: 5s
      timeout: 3s
      retries: 30

  game:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://puk:${DB_PASSWORD:-pukoplot}@db:5432/pukoplot
      PORT: 3000
    ports:
      - "${GAME_PORT:-3000}:3000"

volumes:
  pgdata:
